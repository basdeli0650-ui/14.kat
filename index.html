<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Giriş · 14. Kat</title>
  <meta name="theme-color" content="#09090B">
  <link rel="icon" href="public/branding/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="public/branding/logo-14kat-32.png">
  <link rel="apple-touch-icon" href="public/branding/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="src/styles/tokens.css">
  <link rel="stylesheet" href="src/styles/base.css">
  <link rel="stylesheet" href="src/styles/components.css">
  <link rel="stylesheet" href="src/styles/layout.css">
</head>
<body>
  <main class="giris">
    <div class="kart kart-premium giris__kart" id="giris-kart">
      <img class="logo giris__logo" src="public/branding/logo-14kat-256.png" alt="14. Kat logosu" width="132" height="132">
      <h1 class="giris__baslik">14. Kat</h1>
      <p class="giris__alt" id="giris-alt">Sorumlu hemşire servis yönetimi</p>
      <div id="giris-icerik" aria-live="polite"></div>
      <p class="giris__dip">Veriler yalnızca bu cihazda saklanır.</p>
    </div>
  </main>
  <script src="src/js/ikonlar.js"></script>
  <script src="src/js/kilit.js"></script>
  <script src="src/js/giris.js"></script>
  <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      try {
        navigator.serviceWorker.register('sw.js');
        let yenilendi = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => { if (!yenilendi) { yenilendi = true; location.reload(); } });
      } catch (e) { /* önbellek olmadan devam */ }
    }
  </script>
</body>
</html>
