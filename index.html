<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Giriş · 14. Kat</title>
  <meta name="theme-color" content="#09090B">
  <link rel="icon" href="public/branding/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="public/branding/logo-14kat-32.png">
  <link rel="apple-touch-icon" href="public/branding/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="src/styles/tokens.css">
  <link rel="stylesheet" href="src/styles/base.css">
  <link rel="stylesheet" href="src/styles/components.css">
  <link rel="stylesheet" href="src/styles/layout.css">
</head>
<body>
  <main class="giris">
    <div class="kart kart-premium giris__kart">
      <img class="logo giris__logo" src="public/branding/logo-14kat-256.png" alt="14. Kat logosu" width="132" height="132">
      <h1 class="giris__baslik">14. Kat</h1>
      <p class="giris__alt">Sorumlu hemşire servis yönetimi</p>

      <!-- Kimlik doğrulama henüz bağlı değil: form yalnızca panele yönlendirir. -->
      <form class="giris__form" action="panel.html" method="get">
        <div class="alan">
          <label class="alan__etiket" for="kullanici">Kullanıcı adı</label>
          <input class="girdi" id="kullanici" name="kullanici" autocomplete="username" required>
        </div>
        <div class="alan">
          <label class="alan__etiket" for="sifre">Şifre</label>
          <input class="girdi" id="sifre" type="password" autocomplete="current-password" required>
        </div>
        <label class="onay"><input type="checkbox" name="hatirla"> Beni hatırla</label>
        <button class="btn btn-birincil btn-tam" type="submit"><svg class="ikon" aria-hidden="true"><use href="#i-kilit"/></svg>Giriş yap</button>
      </form>
      <p class="giris__dip">Yalnızca 14. kat personeli içindir.</p>
    </div>
  </main>
  <script src="src/js/ikonlar.js"></script>
  <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      try { navigator.serviceWorker.register('sw.js'); } catch (e) { /* önbellek olmadan devam */ }
    }
  </script>
</body>
</html>
